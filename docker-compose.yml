version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_asyncpg
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://myuser:1234@postgres:5432/mydb
    depends_on:
      postgres:
        condition: service_healthy

  # redis:
  #   image: redis:7.4-alpine
  #   container_name: redis_cache
  #   restart: always
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

  backend:
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend_tsx_123
      dockerfile: Dockerfile
    depends_on:
      - backend
    volumes:
      - ./frontend_tsx_123:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres_data:
  redis_data:
    driver: local
  frontend_node_modules:
    name: petnetflix_frontend_node_modules_dev